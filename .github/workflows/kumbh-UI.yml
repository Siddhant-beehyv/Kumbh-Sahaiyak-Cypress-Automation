name: Kumbh UI Automation Suit

on:  
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 2 * * 1-5" # Runs at 8:00 AM IST (2:30 AM UTC) every Monday to Friday


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Install dependencies
      - name: Install dependencies
        run: cd UI-Testing && npm install  

      # Run tests
      - name: Run tests
        run: cd UI-Testing && npm test
        
      # Get build info
      - name: Get build info
        if: always()
        id: build_info
        run: |
          echo "::set-output name=build_time::$(TZ='Asia/Kolkata' date)"
          echo "::set-output name=build_number::${GITHUB_RUN_NUMBER}"
    
      - name: Move HTML report to report folder
        if: always()
        run: | 
            mv /home/runner/work/Kumbh-Testing/Kumbh-Testing/UI-Testing/cypress/screenshots /home/runner/work/Kumbh-Testing/Kumbh-Testing/UI-Testing/cypress/reports


      - name: Upload HTML report
        if: always()    # Ensure this step always runs
        uses: actions/upload-artifact@v3
        env:
          BUILD_NUMBER: ${{ steps.build_info.outputs.build_number }}
        with:
         name: Kumbh-UI-Execution-Report-${{ env.BUILD_NUMBER }}  # Append the build number to the artifact name
         path: /home/runner/work/Kumbh-Testing/Kumbh-Testing/UI-Testing/cypress/reports
